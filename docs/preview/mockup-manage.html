  font-size: var(--mm-font-xs);

.mm-spin {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: var(--mm-space-2);

  /* 外圈留白不由自己给：遮罩态由 inset 铺满，裸态由放进来的容器决定。

  padding: 0;

  color: var(--mm-color-text-dim);

  font-size: var(--mm-font-sm);

/* 局部遮罩：盖住最近的定位父级 */

.mm-spin--mask {

  position: absolute;

  inset: 0;

  background: var(--mm-color-bg-page);

}



.mm-spin__ring {

  display: block;

  width: var(--mm-spin-size);

  height: var(--mm-spin-size);

  border: var(--mm-border-w) solid var(--mm-color-border);

  border-top-color: var(--mm-color-accent);

  border-radius: 50%;

  animation: mm-spin-rotate var(--mm-spin-duration, 0.8s) linear infinite;

}



@keyframes mm-spin-rotate {

  to {

    transform: rotate(360deg);

  }

}



.mm-spin__tip {

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
