<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>官方 loading 遮罩演示（黑色背景转圈）</title>
<!--
  目标：像素级还原官方 docs/原版/app.v4.js 的 $load 遮罩视觉。
  - 全屏半透明黑底：background: rgba(0,0,0,0.55)
  - load8 转圈：空心圆环，上/右/下边框半透明白，左边框纯白，1.1s 线性旋转
  - 下方文案：白字 14px，字距 1px，距圈 12px
  结构照官方 render（app.v4.js 1218-1232）：
    .loading-main > .load-container.load8 > .loader("Loading...") + <br> + <span>{{text}}</span>
-->
<style>
  /* —— 遮罩层：全屏半透明黑，居中内容 —— */
  .loading-main {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
  }

  /* —— 内容容器：竖排，点击 6 次自动关闭（官方 close 逻辑）—— */
  .load-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  /* —— load8 转圈：空心圆环，仅左边框为实色，整圈旋转 —— */
  .load8 .loader,
  .load8 .loader:after {
    border-radius: 50%;
    width: 36px;
    height: 36px;
  }
  .load8 .loader {
    font-size: 10px;
    position: relative;
    text-indent: -9999em;            /* 隐藏 "Loading..." 文本，仅留无障碍语义 */
    border-top: 0.4em solid rgba(255, 255, 255, 0.25);
    border-right: 0.4em solid rgba(255, 255, 255, 0.25);
    border-bottom: 0.4em solid rgba(255, 255, 255, 0.25);
    border-left: 0.4em solid #ffffff;
    transform: translateZ(0);
    animation: load8 1.1s infinite linear;
  }
  @keyframes load8 {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* —— 下方动态文案（官方 show(text) 传入，如「正在导出...」）—— */
  .loading-main span {
    margin-top: 12px;
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* —— 仅用于本演示页，与官方无关 —— */
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; padding: 40px; }
  .demo-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  button { font-size: 15px; padding: 10px 18px; cursor: pointer; }
  input { font-size: 15px; padding: 8px 10px; width: 220px; }
</style>
</head>
<body>
  <div class="demo-bar">
    <button onclick="showLoading()">显示遮罩</button>
    <button onclick="hideLoading()">隐藏遮罩</button>
    <input id="txt" value="正在导出..." oninput="updateText()" />
  </div>
  <p style="color:#666">文字实时改；点遮罩中心圆圈 6 次也会自动关闭（官方 close 逻辑）。</p>

  <div class="loading-main" id="overlay" style="display:none">
    <div class="load-container load8" onclick="closeLoading(event)">
      <div class="loader">Loading...</div>
      <br />
      <span id="text">正在导出...</span>
    </div>
  </div>

<script>
  var clicks = 0;
  function showLoading() { document.getElementById('overlay').style.display = 'flex'; clicks = 0; }
  function hideLoading() { document.getElementById('overlay').style.display = 'none'; clicks = 0; }
  function updateText() { document.getElementById('text').textContent = document.getElementById('txt').value; }
  function closeLoading(e) {
    // 只有点到圈（.loader）本身才计数，避免误触
    if (!e.target.classList.contains('loader')) return;
    clicks++;
    if (clicks > 5) hideLoading();
  }
  // 默认就显示出来，方便直接看效果
  showLoading();
</script>
</body>
</html>
