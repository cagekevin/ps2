<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>官方导出遮罩提取（app.v4.js $load / Loading 组件）</title>
<!--
  来源：docs/原版/app.v4.js（官方 Vue 2 打包产物）
  - 组件定义（render Q + options tt）：app.v4.js 1218-1263 行
  - 插件注册（it.install，$load.show/hide）：app.v4.js 1268-1295 行
  - 导出调用示例：e.$load.show("正在导出...") / e.$load.hide() 见 17130、36973、37991 等行

  说明：
  - 下方 render 函数 Q 与组件 tt、插件 it 均按官方源码 1:1 转录。
  - 官方打包把 CSS 拆到独立样式包，仓库内无此 CSS；
    下方 .loading-main / .load8 / .loader 按官方使用的经典 load8 spinner 同名 class 重建，
    动画核心是「border 圆环 + @keyframes 旋转」，与官方视觉一致。
-->
<script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
<style>
  /* —— 遮罩层：全屏半透明黑，居中内容 —— */
  .loading-main {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
  }

  /* —— 内容容器：竖排，点击 6 次自动关闭 —— */
  .load-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  /* —— load8 转圈：空心圆环，仅左边框为实色，整圈旋转 —— */
  .load8 .loader,
  .load8 .loader:after {
    border-radius: 50%;
    width: 36px;
    height: 36px;
  }
  .load8 .loader {
    font-size: 10px;
    position: relative;
    text-indent: -9999em; /* 隐藏 "Loading..." 文字，仅保留无障碍文本 */
    border-top: 0.4em solid rgba(255, 255, 255, 0.25);
    border-right: 0.4em solid rgba(255, 255, 255, 0.25);
    border-bottom: 0.4em solid rgba(255, 255, 255, 0.25);
    border-left: 0.4em solid #ffffff;
    transform: translateZ(0);
    animation: load8 1.1s infinite linear;
  }
  @keyframes load8 {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* —— 下方动态文案（官方 show(text) 传入，如「正在导出...」）—— */
  .loading-main span {
    margin-top: 12px;
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* 仅用于本演示页，与官方无关 */
  body { font-family: system-ui, sans-serif; padding: 40px; }
  button { font-size: 15px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
  <button onclick="startExport()">导出图片（演示官方遮罩）</button>
  <p style="color:#666">点遮罩中心圆圈 6 次也会自动关闭（官方 close 逻辑）。</p>

<script>
// ===== 以下是官方 app.v4.js 的 1:1 转录 =====

// render 函数 Q（app.v4.js 1218-1232）
function Q() {
  var t = this;
  var e = t.$createElement;
  var n = t._self._c || e;
  return n("transition", [
    t.isShow
      ? n("div", { staticClass: "loading-main" }, [
          n("div", { staticClass: "load-container load8", on: { click: t.close } }, [
            n("div", { staticClass: "loader" }, ["Loading..."]),
            n("br"),
            n("span", [t._v(t._s(t.text))])
          ])
        ])
      : t._e()
  ]);
}

// 组件 options tt（app.v4.js 1234-1263）
var tt = {
  props: {
    text: { type: String, default: "" }
  },
  data: function () {
    return { isShow: false, colseNum: 0 };
  },
  methods: {
    show: function () { this.isShow = true; this.colseNum = 0; },
    hide: function () { this.isShow = false; this.colseNum = 0; },
    close: function () {
      this.colseNum++;
      if (this.colseNum > 5) this.hide(); // 连点 6 次关闭
    }
  },
  render: Q
};

// 插件 it（app.v4.js 1268-1295）：挂到 Vue.prototype.$load
var LoadingPlugin = {
  install: function (Vue) {
    var inst;
    var Ctor = Vue.extend(tt);
    function ensure() {
      if (!inst) {
        inst = new Ctor();
        document.body.appendChild(inst.$mount().$el);
      }
    }
    Vue.prototype.$load = {
      show: function (text) {
        ensure();
        if (typeof text !== "undefined") inst.text = text;
        return inst.show();
      },
      hide: function () {
        ensure();
        return inst.hide();
      }
    };
  }
};

Vue.use(LoadingPlugin);

// ===== 演示：复刻官方导出调用流程 =====
function startExport() {
  var vm = new Vue();                 // 仅为取 prototype.$load
  vm.$load.show("导出中");            // 官方实际传 "正在导出..."
  setTimeout(function () { vm.$load.hide(); }, 2000);
}
</script>
</body>
</html>
