<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>「转矢量」图标 · 真实排版预览</title>
<style>
  :root{
    --bg-base:#363636; --bg-hover:#3d3d3d; --text:#c3c3c3; --text-strong:#f5f5f5;
    --text-dim:#9a9a9a; --accent:#006fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC",sans-serif;}
  body{background:#1a1a1a;color:var(--text);padding:24px;display:flex;flex-direction:column;gap:20px;}
  .panel{width:300px;background:var(--bg-base);border-radius:8px;padding:10px;
    display:flex;flex-direction:column;gap:8px;}
  .cap{font-size:11px;color:var(--text-dim);}
  .row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .ib{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    border:none;border-radius:4px;background:none;color:var(--text);font-size:20px;cursor:pointer;}
  .ib svg{width:1em;height:1em;display:block;fill:currentColor;}
  .ib:hover{background:var(--bg-hover);}
  .ib:disabled{opacity:.35;cursor:not-allowed;}
  .sep{width:1px;height:20px;background:#4b4b4b;}
  .zoom{display:flex;gap:20px;align-items:flex-end;}
  .zoom figure{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .zoom figcaption{font-size:10px;color:var(--text-dim);}
  .zoom svg{fill:currentColor;}
  b{color:var(--text-strong);font-weight:600;}
</style>
</head>
<body>

<div class="panel">
  <p class="cap"><b>未选中图层</b> —— 图标灰掉（点了也没用）</p>
  <div class="row">
    <button class="ib" disabled title="翻译"><svg viewBox="0 0 1024 1024"><path d="M880 189H460L420 51H143c-51 0-92 41-92 92v599c0 51 41 92 92 92h323l46 139h369c51 0 92-41 92-92V281c0-51-41-92-92-92z"/></svg></button>
    <button class="ib" title="拆分文本"><svg viewBox="0 0 1024 1024"><path d="M864 72H248v88h616v616h88V72h-88z"/><path d="M72 952h704V248H72v704z m132-572h440v88H468v352h-88V468H204v-88z"/></svg></button>
    <button class="ib" title="创建按钮"><svg viewBox="0 0 1024 1024"><path d="M950 185H73C33 185 0 217 0 258v509c0 40 33 72 73 72h878c40 0 73-32 73-72V258c0-41-33-73-73-73z"/></svg></button>
    <button class="ib" disabled title="选中图层 → 转矢量"><svg viewBox="30 14 196 212"><use href="#s"/></svg></button>
    <span class="sep"></span>
    <button class="ib" title="复制文字属性"><svg viewBox="0 0 1024 1024"><path d="M861 147H703v48h158c43 0 78 35 78 78v558c0 43-35 78-78 78H304c-43 0-78-35-78-78v-81h-48v81c0 70 57 126 126 126h558c70 0 126-56 126-126V274c0-70-56-126-126-126z"/></svg></button>
    <button class="ib" title="粘贴文字属性"><svg viewBox="0 0 1024 1024"><path d="M861 147H703v48h158c43 0 78 35 78 78v558c0 43-35 78-78 78H304c-43 0-78-35-78-78v-81h-48v81c0 70 57 126 126 126h558c70 0 126-56 126-126V274c0-70-56-126-126-126z"/></svg></button>
    <button class="ib" title="批量文字"><svg viewBox="80 90 880 880"><path d="M807 164H337c-26 0-52 26-52 52v105H181c-26 0-53 26-53 52v470c0 26 26 52 52 52h499c26 0 52-26 52-52V739h105c26 0 52-26 52-52V217c0-26-26-53-52-53z"/></svg></button>
  </div>
</div>
